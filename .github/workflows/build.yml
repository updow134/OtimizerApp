name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Extrair projeto
        run: unzip -q OptimizerApp.zip
      - name: Compilar
        working-directory: OptimizerApp
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Optimizer-debug-apk
          path: OptimizerApp/app/build/outputs/apk/debug/*.apk
